name: "Compliance Deadline Reminder"
description: "Opens or updates a GitHub issue reminding you of an annual report or franchise tax deadline."
author: "Epics Deals LLC"
branding:
  icon: "bell"
  color: "yellow"

inputs:
  state:
    description: "US state the filing is due in (e.g. Wyoming)"
    required: true
  filing:
    description: "What is due (e.g. Annual report, Franchise tax)"
    required: false
    default: "Annual report"
  deadline-date:
    description: "Deadline in YYYY-MM-DD format (e.g. 2027-04-01)"
    required: true
  days-before:
    description: "Create/update the reminder issue when this many days (or fewer) remain"
    required: false
    default: "30"
  issue-label:
    description: "Label applied to the reminder issue"
    required: false
    default: "compliance"

runs:
  using: "composite"
  steps:
    - name: Check deadline and upsert reminder issue
      uses: actions/github-script@v7
      with:
        script: |
          const state = '${{ inputs.state }}';
          const filing = '${{ inputs.filing }}';
          const deadlineStr = '${{ inputs.deadline-date }}';
          const threshold = parseInt('${{ inputs.days-before }}', 10);
          const label = '${{ inputs.issue-label }}';

          const deadline = new Date(deadlineStr + 'T00:00:00Z');
          if (isNaN(deadline)) {
            core.setFailed(`Invalid deadline-date: "${deadlineStr}". Use YYYY-MM-DD.`);
            return;
          }
          const now = new Date();
          const days = Math.ceil((deadline - now) / 86400000);

          if (days > threshold) {
            core.info(`${filing} (${state}) is ${days} days away — no reminder yet.`);
            return;
          }

          const title = `[Compliance] ${filing} due in ${state} — ${deadlineStr}`;
          const body = [
            `**${filing}** for **${state}** is due on **${deadlineStr}** (${days} day(s) remaining).`,
            ``,
            `Filing late can mean penalties or administrative dissolution.`,
            ``,
            `- State: ${state}`,
            `- Filing: ${filing}`,
            `- Deadline: ${deadlineStr}`,
            `- Days remaining: ${days}`,
            ``,
            `_Reminder generated by the Epics Deals compliance-reminder-action._`
          ].join('\n');

          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });

          const existing = issues.find(i => i.title.startsWith(`[Compliance] ${filing} due in ${state}`));

          if (existing) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `⏰ Update: **${days} day(s)** remaining until the deadline (${deadlineStr}).`,
            });
            core.info(`Updated reminder issue #${existing.number}.`);
          } else {
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
            core.info(`Created reminder issue #${issue.number}.`);
          }
